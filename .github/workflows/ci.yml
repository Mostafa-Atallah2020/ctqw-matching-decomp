name: CI

on: [push, pull_request]

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

  isort:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run isort
      run: isort . --check

  black:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run black
      run: black . --check

  flake8:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run flake8
      run: flake8

  mypy:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run mypy
      run: python -m mypy .

  spelling:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run pylint
      run: pylint ./**/*.py

  pytest:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-enchant
        python -m pip install --upgrade pip
        pip install -e .[lint,test]

    - name: Run PyTest
      run: pytest -v --cov
